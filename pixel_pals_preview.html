AABDAuQrI7AFGVwGOvQBZO9x6rgu/667klI2BFAABTClAIUkqWUMBAACI4hfcyKPVlQFDLgAAAABJRU5ErkJggg=="};const src=(h,b,f=0)=>ASSETS[`c${h}${b}${f}.png`];const img=(h,b,f=0,cls='sprite',style='')=>`<img draggable="false" class="${cls}" style="${style}" src="${src(h,b,f)}" alt="">`;function resize(){let s=Math.min(innerWidth/360,innerHeight/640);$('game').style.transform=`scale(${s})`};addEventListener('resize',resize);resize();function set(n){scene=n;clearTimeout(timer);clearInterval(walk);$('steps').innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<=n?'on':''}"></i>`).join('');bottom.innerHTML=''}function button(text,fn,disabled=false){bottom.innerHTML=`<button class="cta" ${disabled?'disabled':''}>${text}</button>`;bottom.firstChild.onclick=fn}function selection(){set(0);picks=[];main.innerHTML=`<div class="eyebrow">01 / CHOOSE</div><h1>Mix two pals!</h1><p>Pick a face and an outfit to create a new pet.</p><div class="grid">${names.map((n,i)=>`<button class="card" data-i="${i}">${img(i,i)}<b>${n}</b><em></em></button>`).join('')}</div><div class="hint" id="sel">Choose 2 characters</div>`;button('FUSE  ✦',fusion,true);main.querySelectorAll('.card').forEach(c=>c.onclick=()=>{let i=+c.dataset.i;if(picks.includes(i))picks=picks.filter(x=>x!==i);else if(picks.length<2)picks.push(i);else picks=[picks[1],i];main.querySelectorAll('.card').forEach(e=>{let j=picks.indexOf(+e.dataset.i);e.classList.toggle('active',j>=0);e.querySelector('em').textContent=j<0?'':j===0?'FACE ✓':'OUTFIT ✓'});$('sel').textContent=picks.length+'/2 selected';bottom.firstChild.disabled=picks.length!==2})}function fusion(){if(picks.length!==2)return;set(1);main.innerHTML=`<div class="eyebrow">02 / FUSION</div><h1>Magic in motion!</h1><p>Combining your two pixel pals...</p><div class="arena"><div class="orb"></div>${img(picks[0],picks[0],0,'sprite fuseleft','width:125px')}${img(picks[1],picks[1],0,'sprite fuseright','width:125px')}</div><div class="tag">FUSING ✦</div>`;timer=setTimeout(hatch,1000)}
const cracks=['','M100 18l-9 35 19 14','M100 18l-9 35 19 14-20 30 24 20','M100 18l-9 35 19 14-20 30 24 20-20 33 M90 97l-27 13-20-10','M100 18l-9 35 19 14-20 30 24 20-20 33 14 45 M90 97l-27 13-20-10 M114 117l30-20 24 10','M100 18l-9 35 19 14-20 30 24 20-20 33 14 45 M90 97l-27 13-20-10 M114 117l30-20 24 10 M94 150l-31 20'];function hatch(){set(2);hits=0;tool=0;main.innerHTML=`<div class="eyebrow">03 / HATCH</div><h1>Crack the egg!</h1><p>Tap five times to meet your new pal.</p><button class="egg float" id="egg" aria-label="Tap egg"><svg viewBox="0 0 200 230"><defs><linearGradient id="eg" x2="1" y2="1"><stop stop-color="#fff0ba"/><stop offset=".45" stop-color="#e7a6e8"/><stop offset="1" stop-color="#8b7ee5"/></linearGradient></defs><ellipse cx="100" cy="213" rx="67" ry="9" fill="#1d1633" opacity=".5"/><path d="M100 10C60 10 20 91 20 144S53 207 100 207 180 183 180 144 140 10 100 10Z" fill="url(#eg)" stroke="#302346" stroke-width="6"/><path d="M56 65h14v14h14v14H70v14H56V93H42V79h14zM125 132h15v15h15v15h-15v15h-15v-15h-15v-15h15z" fill="#fff1a6"/><path d="M130 54h12v12h-12zM48 143h13v13H48zM83 176h12v12H83z" fill="#fff" opacity=".7"/><path id="crack" fill="none" stroke="#39264b" stroke-width="5" stroke-linejoin="miter"/></svg></button><div class="tag" id="count">0 / 5 TAPS</div><div class="bar"><i id="progress" style="width:0"></i></div><div class="tools"><button class="active" aria-label="Hammer">🔨</button><button aria-label="Axe">🪓</button><button aria-label="Magic">✦</button></div>`;main.querySelectorAll('.tools button').forEach((b,i)=>b.onclick=()=>{tool=i;main.querySelectorAll('.tools button').forEach((e,j)=>e.classList.toggle('active',i===j))});$('egg').onclick=()=>{if(scene!==2||hits>=5)return;hits++;$('egg').className='egg';void $('egg').offsetWidth;$('egg').className='egg shake';$('crack').setAttribute('d',cracks[hits]);$('count').textContent=hits+' / 5 TAPS';$('progress').style.width=hits*20+'%';if(hits===5){$('egg').disabled=true;timer=setTimeout(reward,300)}}}function particles(){return Array.from({length:26},(_,i)=>`<i class="particle" style="--x:${Math.cos(i*2.4)*(70+i%5*20)}px;--y:${Math.sin(i*2.4)*(70+i%5*20)}px;--c:${['#ffd46c','#f5a6d9','#a5e5f5'][i%3]}"></i>`).join('')}function reward(){set(3);main.innerHTML=`<div class="eyebrow">04 / REVEAL</div><h1>New pal unlocked!</h1><p>Your custom fusion is ready.</p><div class="reward"><div class="orb"></div>${particles()}${img(picks[0],picks[1])}</div><div class="tag">✦ ${names[picks[0]].toUpperCase()} × ${names[picks[1]].toUpperCase()} ✦</div>`;button('PLAY WITH MY PAL',phone)}function phone(){set(4);main.innerHTML=`<div class="eyebrow">05 / PLAY</div><h1>Meet your screen pet!</h1><p>Drag your pal around the demo home screen.</p><div class="phone" id="phone"><div style="font-weight:800;padding-top:10px">9:41</div><div class="icons">${['✉','♫','☀','▣','♥','⚙','☎','◈','✿'].map(x=>`<span>${x}</span>`).join('')}</div><div class="dock">●　◆　■</div>${img(picks[0],picks[1],0,'sprite pet','left:65px;top:190px')}</div><div class="hint" id="dragHint">Touch & drag your pal</div>`;button('HATCH NOW  →',exitAd);let pet=main.querySelector('.pet'),ph=$('phone'),drag=false,dx=0,dy=0,f=0;walk=setInterval(()=>{if(!drag)pet.src=src(picks[0],picks[1],++f%4)},180);pet.onpointerdown=e=>{drag=true;let r=pet.getBoundingClientRect(),s=ph.getBoundingClientRect().width/ph.offsetWidth;dx=(e.clientX-r.left)/s;dy=(e.clientY-r.top)/s;pet.setPointerCapture(e.pointerId);$('dragHint').textContent='Nice! Your pal follows your touch.'};pet.onpointermove=e=>{if(!drag)return;let r=ph.getBoundingClientRect(),s=r.width/ph.offsetWidth;pet.style.left=Math.max(0,Math.min(ph.clientWidth-82,(e.clientX-r.left)/s-dx-7))+'px';pet.style.top=Math.max(0,Math.min(ph.clientHeight-92,(e.clientY-r.top)/s-dy-7))+'px'};pet.onpointerup=pet.onpointercancel=()=>drag=false}function exitAd(){if(window.ExitApi&&typeof ExitApi.exit==='function'){ExitApi.exit();return}let t=$('toast');t.textContent='Preview: install CTA triggered';t.style.display='block';setTimeout(()=>t.style.display='none',1800)}selection();
